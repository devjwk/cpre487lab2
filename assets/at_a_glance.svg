<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" role="img" aria-label="Lab 2 at a glance: matches TensorFlow, speed, where the time goes, MACs predict time">
<title>Lab 2 at a glance: matches TensorFlow, speed, where the time goes, MACs predict time</title>
<style>.q{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.5px}.big{font:800 44px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.sub{font:500 14px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}.lab{font:500 13px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1220}.val{font:700 13px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1220}.valbig{font:700 16px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B1220}.note{font:500 12px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}.tiny{font:600 11px ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}</style>
<rect width="1200" height="384" fill="#ffffff"/>
<g transform="translate(0,0)">
<rect width="285" height="384" fill="#F8FAFC"/>
<rect width="285" height="6" fill="#1D4ED8"/>
<text x="18" y="38" class="q" fill="#1D4ED8">DOES IT MATCH TENSORFLOW?</text>
<text x="18" y="92" class="big" fill="#0B1220">12 / 12</text>
<text x="18" y="118" class="sub">Every layer output reproduced for</text>
<text x="18" y="136" class="sub">3 images, on x86 and the ZedBoard.</text>
<g transform="translate(18,170)"><rect x="0" y="0" width="32" height="32" fill="#1D4ED8"/>
<rect x="40" y="0" width="32" height="32" fill="#1D4ED8"/>
<rect x="80" y="0" width="32" height="32" fill="#1D4ED8"/>
<rect x="120" y="0" width="32" height="32" fill="#1D4ED8"/>
<rect x="160" y="0" width="32" height="32" fill="#1D4ED8"/>
<rect x="200" y="0" width="32" height="32" fill="#1D4ED8"/>
<rect x="0" y="40" width="32" height="32" fill="#1D4ED8"/>
<rect x="40" y="40" width="32" height="32" fill="#1D4ED8"/>
<rect x="80" y="40" width="32" height="32" fill="#1D4ED8"/>
<rect x="120" y="40" width="32" height="32" fill="#1D4ED8"/>
<rect x="160" y="40" width="32" height="32" fill="#1D4ED8"/>
<rect x="200" y="40" width="32" height="32" fill="#1D4ED8"/>
<text x="0" y="106" class="valbig">max error 4.17 × 10⁻⁷</text>
<text x="0" y="128" class="note">full model, float32 rounding level</text></g></g>
<g transform="translate(305,0)">
<rect width="285" height="384" fill="#F8FAFC"/>
<rect width="285" height="6" fill="#1D4ED8"/>
<text x="18" y="38" class="q" fill="#1D4ED8">HOW FAST IS IT?</text>
<text x="18" y="92" class="big" fill="#0B1220">60 ms</text>
<text x="18" y="118" class="sub">Per image on x86 (i7-12700),</text>
<text x="18" y="136" class="sub">unoptimized loops, one thread.</text>
<g transform="translate(18,170)"><text x="0" y="19" class="lab">TF direct</text>
<rect x="104" y="4" width="75" height="22" fill="#E2E8F0"/>
<rect x="104" y="4" width="9.2" height="22" fill="#1D4ED8"/>
<text x="187" y="20" class="val">7 ms</text>
<text x="0" y="57" class="lab">TF predict</text>
<rect x="104" y="42" width="75" height="22" fill="#E2E8F0"/>
<rect x="104" y="42" width="26.4" height="22" fill="#1D4ED8"/>
<text x="187" y="58" class="val">34 ms</text>
<text x="0" y="95" class="lab">C++ x86</text>
<rect x="104" y="80" width="75" height="22" fill="#E2E8F0"/>
<rect x="104" y="80" width="32.5" height="22" fill="#93C5FD"/>
<text x="187" y="96" class="val">60 ms</text>
<text x="0" y="133" class="lab">C++ ZedBoard</text>
<rect x="104" y="118" width="75" height="22" fill="#E2E8F0"/>
<rect x="104" y="118" width="72.0" height="22" fill="#1D4ED8"/>
<text x="187" y="134" class="val">2,272 ms</text>
<text x="0" y="170" class="note">TF = TensorFlow. Log-scale bars.</text></g></g>
<g transform="translate(610,0)">
<rect width="285" height="384" fill="#F8FAFC"/>
<rect width="285" height="6" fill="#1D4ED8"/>
<text x="18" y="38" class="q" fill="#1D4ED8">WHERE DOES THE TIME GO?</text>
<text x="18" y="92" class="big" fill="#0B1220">conv2</text>
<text x="18" y="118" class="sub">One layer takes 58–60% of the</text>
<text x="18" y="136" class="sub">time on both platforms.</text>
<g transform="translate(18,170)"><rect x="0.0" y="0" width="144.4" height="34" fill="#1D4ED8"/>
<rect x="144.4" y="0" width="102.1" height="34" fill="#93C5FD"/>
<rect x="246.5" y="0" width="2.5" height="34" fill="#CBD5E1"/>
<rect x="0" y="50" width="14" height="14" fill="#1D4ED8"/>
<text x="22" y="62" class="lab">conv2</text>
<text x="249" y="62" class="val" text-anchor="end">58%</text>
<rect x="0" y="78" width="14" height="14" fill="#93C5FD"/>
<text x="22" y="90" class="lab">the other 5 convolutions</text>
<text x="249" y="90" class="val" text-anchor="end">41%</text>
<rect x="0" y="106" width="14" height="14" fill="#CBD5E1"/>
<text x="22" y="118" class="lab">pooling, dense, softmax</text>
<text x="249" y="118" class="val" text-anchor="end">1%</text></g></g>
<g transform="translate(915,0)">
<rect width="285" height="384" fill="#F8FAFC"/>
<rect width="285" height="6" fill="#1D4ED8"/>
<text x="18" y="38" class="q" fill="#1D4ED8">CAN WE PREDICT IT?</text>
<text x="18" y="92" class="big" fill="#0B1220">MACs</text>
<text x="18" y="118" class="sub">A layer’s share of multiply-adds</text>
<text x="18" y="136" class="sub">is close to its share of time.</text>
<g transform="translate(18,170)"><text x="0" y="19" class="lab">conv2</text>
<rect x="52" y="2" width="148.6" height="13" fill="#1D4ED8"/>
<rect x="52" y="17" width="140.5" height="13" fill="#93C5FD"/>
<text x="206.6" y="13" class="tiny">61%</text>
<text x="206.6" y="28" class="tiny">58%</text>
<text x="0" y="59" class="lab">conv4</text>
<rect x="52" y="42" width="39.2" height="13" fill="#1D4ED8"/>
<rect x="52" y="57" width="39.2" height="13" fill="#93C5FD"/>
<text x="97.2" y="53" class="tiny">16%</text>
<text x="97.2" y="68" class="tiny">16%</text>
<text x="0" y="99" class="lab">conv3</text>
<rect x="52" y="82" width="23.1" height="13" fill="#1D4ED8"/>
<rect x="52" y="97" width="23.1" height="13" fill="#93C5FD"/>
<text x="81.1" y="93" class="tiny">10%</text>
<text x="81.1" y="108" class="tiny">10%</text>
<text x="0" y="139" class="lab">conv1</text>
<rect x="52" y="122" width="16.1" height="13" fill="#1D4ED8"/>
<rect x="52" y="137" width="21.4" height="13" fill="#93C5FD"/>
<text x="79.4" y="133" class="tiny">7%</text>
<text x="79.4" y="148" class="tiny">9%</text>
<rect x="0" y="163" width="12" height="12" fill="#1D4ED8"/><text x="18" y="174" class="note">share of MACs</text>
<rect x="126" y="163" width="12" height="12" fill="#93C5FD"/><text x="144" y="174" class="note">share of time</text></g></g>
</svg>
